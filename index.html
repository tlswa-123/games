<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人物展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .video-wrapper {
    position: relative;
    width: 440px;
    height: 512px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(234,88,12,0.15);
    background: #000;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .status-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 10;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.4s ease;
  }
  .status-badge.idle { border-color: rgba(100,200,100,0.3); color: #8fdf8f; }
  .status-badge.speak { border-color: rgba(234,88,12,0.5); color: #f97316; }
  .status-badge.nod { border-color: rgba(96,165,250,0.5); color: #60a5fa; }
  .controls {
    display: flex;
    gap: 16px;
  }
  .btn {
    padding: 12px 32px;
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    color: #ccc;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(10px);
    letter-spacing: 1px;
    user-select: none;
  }
  .btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-1px);
  }
  .btn.active {
    background: rgba(234,88,12,0.2);
    border-color: #ea580c;
    color: #f97316;
    box-shadow: 0 0 20px rgba(234,88,12,0.2);
  }
  .hint {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    margin-top: -8px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="video-wrapper">
    <canvas id="canvas" width="880" height="1024"></canvas>
    <div class="status-badge idle" id="statusBadge">IDLE</div>
  </div>
  <div class="controls">
    <button class="btn active" data-action="idle">待机</button>
    <button class="btn" data-action="speak">说话</button>
    <button class="btn" data-action="nod">点头</button>
  </div>
  <div class="hint">点击切换动作 · 视频自动循环播放</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const badge = document.getElementById('statusBadge');
const W = 880, H = 1024;

const labels = { idle: 'IDLE', speak: 'SPEAK', nod: 'NOD' };
const videos = {};
let currentAction = null;
let switching = false;
let pendingAction = null;
let blendFrom = null, blendTo = null, blendAlpha = 0;
const BLEND_SPEED = 0.05;

// Load all videos
let readyCount = 0;
Object.keys(labels).forEach(action => {
  const v = document.createElement('video');
  v.muted = true;
  v.playsInline = true;
  v.preload = 'auto';
  v.src = action + '_loop.mp4';
  v.addEventListener('canplaythrough', function onReady() {
    v.removeEventListener('canplaythrough', onReady);
    readyCount++;
    if (readyCount === 3) start();
  });
  v.addEventListener('error', function() {
    console.error('Failed to load:', action, v.error);
  });
  videos[action] = v;
});

function start() {
  const idleVid = videos.idle;
  idleVid.loop = true;
  idleVid.play().then(() => {
    currentAction = 'idle';
    render();
  });
}

// Button clicks
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => switchAction(btn.dataset.action));
});

function switchAction(action) {
  if (action === currentAction || switching) return;
  
  const target = videos[action];
  if (!target || target.readyState < 2) return;
  
  switching = true;
  pendingAction = action;
  
  // Update UI
  document.querySelectorAll('.btn').forEach(b =>
    b.classList.toggle('active', b.dataset.action === action)
  );
  badge.className = 'status-badge ' + action;
  badge.textContent = labels[action];
  
  // Start new video from beginning
  target.loop = true;
  target.currentTime = 0;
  target.play().then(() => {
    blendFrom = videos[currentAction];
    blendTo = target;
    blendAlpha = 0;
  }).catch(() => {
    // Fallback: direct switch
    videos[currentAction].pause();
    currentAction = action;
    switching = false;
  });
}

function render() {
  // Blend transition
  if (blendFrom && blendTo) {
    blendAlpha += BLEND_SPEED;
    if (blendAlpha >= 1) {
      blendAlpha = 1;
      blendFrom.pause();
      blendFrom = null;
      blendTo = null;
      currentAction = pendingAction;
      switching = false;
    }
  }
  
  ctx.clearRect(0, 0, W, H);
  
  if (blendFrom && blendTo) {
    ctx.globalAlpha = 1;
    ctx.drawImage(blendFrom, 0, 0, W, H);
    ctx.globalAlpha = blendAlpha;
    ctx.drawImage(blendTo, 0, 0, W, H);
    ctx.globalAlpha = 1;
  } else if (currentAction && videos[currentAction]) {
    ctx.drawImage(videos[currentAction], 0, 0, W, H);
  }
  
  requestAnimationFrame(render);
}
</script>
</body>
</html>
