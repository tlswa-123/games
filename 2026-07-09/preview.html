<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>透明底动画预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; color: #eee; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; }
h1 { text-align: center; margin-bottom: 20px; font-size: 20px; }
.preview-container { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; }
.preview-item { text-align: center; }
.preview-item h2 { font-size: 16px; margin-bottom: 10px; color: #ea580c; }
.checkerboard {
  background-image:
    linear-gradient(45deg, #555 25%, transparent 25%),
    linear-gradient(-45deg, #555 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #555 75%),
    linear-gradient(-45deg, transparent 75%, #555 75%);
  background-size: 30px 30px;
  background-position: 0 0, 0 15px, 15px -15px, -15px 0px;
  background-color: #333;
  display: inline-block;
  padding: 10px;
  border-radius: 8px;
}
.checkerboard img { max-height: 400px; display: block; }
.info { margin-top: 8px; font-size: 12px; color: #999; }
.footer { text-align: center; margin-top: 30px; font-size: 13px; color: #777; }
.footer a { color: #ea580c; }
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var base = 'https://github.com/tlswa-123/gif/releases/download/v2026-07-09-apng';
  var mapping = {
    'img-touch_chin': '/2026-07-09.touch_chin.apng',
    'img-brush_hair': '/2026-07-09.brush_hair.apng',
    'img-idle1': '/2026-07-09.idle1.apng',
    'img-idle2': '/2026-07-09.idle2.apng',
    'img-talk': '/2026-07-09.talk_loop.apng'
  };
  for (var key in mapping) {
    var img = document.getElementById(key);
    if (img) img.src = base + mapping[key];
  }
});
</script>
</head>
<body>
<h1>透明底动画预览（棋盘格 = 透明区域）</h1>
<div class="preview-container">
  <div class="preview-item">
    <h2>摸下巴</h2>
    <div class="checkerboard"><img id="img-touch_chin" src="" alt="touch_chin"></div>
    <div class="info">APNG · 1244×1660 · 241帧</div>
  </div>
  <div class="preview-item">
    <h2>撩头发</h2>
    <div class="checkerboard"><img id="img-brush_hair" src="" alt="brush_hair"></div>
    <div class="info">APNG · 1244×1660 · 241帧</div>
  </div>
  <div class="preview-item">
    <h2>待机1</h2>
    <div class="checkerboard"><img id="img-idle1" src="" alt="idle1"></div>
    <div class="info">APNG · 404×720 · 481帧</div>
  </div>
  <div class="preview-item">
    <h2>待机2</h2>
    <div class="checkerboard"><img id="img-idle2" src="" alt="idle2"></div>
    <div class="info">APNG · 404×720 · 481帧</div>
  </div>
  <div class="preview-item">
    <h2>说话</h2>
    <div class="checkerboard"><img id="img-talk" src="" alt="talk"></div>
    <div class="info">APNG · 720×1280 · 240帧 (10秒循环)</div>
  </div>
</div>
<div class="footer">
  单个文件下载 → <a href="https://github.com/tlswa-123/gif/releases/tag/v2026-07-09-apng" target="_blank">GitHub Release 页面</a>
</div>
</body>
</html>
